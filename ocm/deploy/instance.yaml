# GreenhouseStack Instance — applied SEPARATELY after kro has processed the RGD
# and created the GreenhouseStack CRD.
#
# Apply with: make -f Makefile.ocm deploy-instance
# (waits for CRD readiness automatically)
#
# To upgrade: update snapshot paths + versions here, then re-apply.
# Run `make snapshot-urls` to get current sha values from the live cluster.
apiVersion: kro.run/v1alpha1
kind: GreenhouseStack
metadata:
  name: greenhouse
  namespace: greenhouse
spec:
  registryHost: "registry.ocm-system.svc.cluster.local:5000"
  imageRegistry: "ghcr.io"

  certManagerSnapshotPath: "sha-15457104823554620187"
  certManagerVersion: "1.16.1"

  ocmControllerSnapshotPath: "sha-3868847230746277828"
  ocmControllerVersion: "0.33.0"

  greenhouseSnapshotPath: "sha-6660783123634428906"
  greenhouseVersion: "0.16.1"

  # Image content digests from the OCM-signed bundle (Option 1 digest pinning).
  # Get current values with: make -f Makefile.ocm print-image-digests
  # greenhouseImageDigest pins manager/idproxy/cors-proxy/authz (one shared binary image).
  greenhouseImageDigest: "sha256:0c0cac95a1dafbb9a22d64aaf3cc425e990f2eb9b7863b3e53749e2878472b13"
  dashboardImageDigest: "sha256:ae366951d37198d05d6b3d5859dec8181530d380ea7b9a8a8cfc5a8f07937631"

  tlsSecretName: "ocm-registry-tls-certs"
  valuesSecretName: "greenhouse-values"
