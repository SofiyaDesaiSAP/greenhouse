# GreenhouseStack Instance — applied SEPARATELY after kro has processed the RGD
# and created the GreenhouseStack CRD.
#
# Apply with: make -f Makefile.ocm deploy-instance
# (waits for CRD readiness automatically)
#
# Updating to a new greenhouse version: bump componentVersion and image digests only.
apiVersion: kro.run/v1alpha1
kind: GreenhouseStack
metadata:
  name: greenhouse
  namespace: greenhouse
spec:
  onSiteRegistry: "<your-on-site-registry>"
  registrySecretName: "greenhouse-ocm-registry-creds"
  componentVersion: ">=0.23.0"

  # Image content digests from the OCM-signed bundle (Option 1 digest pinning).
  # Get current values with: make -f Makefile.ocm print-image-digests
  # greenhouseImageDigest pins manager/idproxy/cors-proxy/authz (one shared binary image).
  greenhouseImageDigest: "sha256:be2177349a8dbbd58bfb281c81d3181b298f042bd40ae77166e55e848c124afe"
  dashboardImageDigest: "sha256:ae366951d37198d05d6b3d5859dec8181530d380ea7b9a8a8cfc5a8f07937631"

  # Registry prefix for postgres images transferred to the on-site registry.
  # Format: "<on-site-registry>/<path-prefix>", e.g. "registry.example.com/sapcc"
  postgresImageRegistry: "<your-on-site-registry>/<postgres-path-prefix>"

  valuesSecretName: "greenhouse-values"

  # Set false when cert-manager/ocm-controller are not managed via the bootstrap
  # HelmRelease (e.g. pre-installed in the cluster without a kro GreenhouseBootstrap
  # instance). greenhouseHR omits the dependsOn entry for suspended/absent HelmReleases.
  enableCertManager: true
  enableOcmController: true
