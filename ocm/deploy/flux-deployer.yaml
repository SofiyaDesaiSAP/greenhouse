# ONE FluxDeployer — the single entry point for the entire greenhouse stack.
#
# This deploys the greenhouse-stack Helm chart, which contains:
#   - kro ResourceGraphDefinition (greenhouse-stack)
#   - kro GreenhouseStack Instance
#
# Once installed, kro reads the Instance and creates the full resource graph:
#   OCIRepo(cert-manager)   → HelmRelease(cert-manager)
#   OCIRepo(ocm-controller) → HelmRelease(ocm-controller)  dependsOn: cert-manager
#   OCIRepo(greenhouse)     → HelmRelease(greenhouse)       dependsOn: cert-manager, ocm-controller
#
# Flux then reconciles each HelmRelease in dependency order.
#
# Prerequisites before applying this:
#   1. flux install               — Flux controllers running
#   2. helm install kro           — kro running (processes the RGD)
#   3. copy-tls-secret            — ocm-registry-tls-certs present in greenhouse namespace
#   4. create-values-secret       — greenhouse-values secret present in greenhouse namespace
#   5. ComponentVersion + Resources applied (resources.yaml) — Snapshots created

apiVersion: delivery.ocm.software/v1alpha1
kind: FluxDeployer
metadata:
  name: greenhouse-stack
  namespace: greenhouse
spec:
  interval: 10m
  sourceRef:
    kind: Resource
    name: greenhouse-stack-chart
    namespace: greenhouse
  helmReleaseTemplate:
    interval: 10m
    targetNamespace: greenhouse
