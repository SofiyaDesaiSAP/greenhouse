# kro ResourceGraphDefinition for Greenhouse Bootstrap
#
# Installs cluster prerequisites (cert-manager, prometheus-operator CRDs, OCM controller)
# via kro + Flux, pulling charts from the on-site RBSC registry.
#
# After `ocm transfer --copy-resources --recursive`, the RBSC holds Helm chart blobs at
# paths derived from OCM's path-preservation rule (source registry host is stripped):
#   cert-manager:    oci://<rbsc>/cloudoperators/greenhouse-extensions/charts/cert-manager
#   ocm-controller:  oci://<rbsc>/open-component-model/helm/ocm-controller
#
# prometheus-operator-crds is the one exception — it is NOT in the OCM bundle (greenhouse
# unconditionally creates PrometheusRule resources, but prometheus-crds is not an OCM
# component). It always pulls from public OCI. Document this clearly in the demo.
#
# Applied via kustomize (deploy/kustomization.yaml).
# When kro processes this RGD it registers the GreenhouseBootstrap CRD.
# Apply the instance separately: kubectl apply -f deploy/bootstrap-instance.yaml
#
# Schema uses kro v0.9.x SimpleSchema syntax (inline type strings, not {type: string}).
# Status fields use CEL expressions projecting from managed HelmRelease conditions.
apiVersion: kro.run/v1alpha1
kind: ResourceGraphDefinition
metadata:
  name: greenhouse-bootstrap
  namespace: greenhouse
spec:
  schema:
    apiVersion: v1alpha1
    kind: GreenhouseBootstrap
    spec:
      # RBSC registry host, e.g. "ghcr.io/sofiyadesaisap/greenhouse-rbsc"
      rbscRegistry: "string"
      # Name of the docker-registry secret in the greenhouse namespace with RBSC credentials
      registrySecretName: "string"
      certManagerVersion: "string"
      # prometheus-operator-crds is NOT in the OCM bundle — pulls from public OCI.
      prometheusCrdsVersion: "string"
      ocmControllerVersion: "string"

    status:
      certManagerReady: "${certManagerHR.status.conditions[0].status}"
      ocmControllerReady: "${ocmControllerHR.status.conditions[0].status}"

  resources:

    # ── prometheus-operator CRDs ─────────────────────────────────────────────
    # Not in the OCM bundle; pulled from public OCI.
    # Required because the greenhouse chart creates PrometheusRule resources
    # unconditionally — without this CRD the greenhouse HelmRelease fails.
    - id: prometheusOCIRepo
      template:
        apiVersion: source.toolkit.fluxcd.io/v1
        kind: OCIRepository
        metadata:
          name: prometheus-crds-bootstrap
          namespace: greenhouse
        spec:
          interval: 10m
          url: "oci://ghcr.io/prometheus-community/charts/prometheus-operator-crds"
          ref:
            tag: "${schema.spec.prometheusCrdsVersion}"

    - id: prometheusHR
      template:
        apiVersion: helm.toolkit.fluxcd.io/v2
        kind: HelmRelease
        metadata:
          name: prometheus-crds
          namespace: greenhouse
        spec:
          interval: 10m
          targetNamespace: monitoring
          install:
            createNamespace: true
          chartRef:
            kind: OCIRepository
            name: prometheus-crds-bootstrap
            namespace: greenhouse

    # ── cert-manager ─────────────────────────────────────────────────────────
    # Pulled from the RBSC. Path derived from component-constructor.yaml:
    #   access.type: ociArtifact
    #   imageReference: ghcr.io/cloudoperators/greenhouse-extensions/charts/cert-manager:${version}
    # --copy-resources strips the source host and writes the blob to:
    #   <rbscRegistry>/cloudoperators/greenhouse-extensions/charts/cert-manager
    - id: certManagerOCIRepo
      template:
        apiVersion: source.toolkit.fluxcd.io/v1
        kind: OCIRepository
        metadata:
          name: cert-manager-bootstrap
          namespace: greenhouse
        spec:
          interval: 10m
          url: "oci://${schema.spec.rbscRegistry}/cloudoperators/greenhouse-extensions/charts/cert-manager"
          ref:
            tag: "${schema.spec.certManagerVersion}"
          secretRef:
            name: "${schema.spec.registrySecretName}"

    - id: certManagerHR
      template:
        apiVersion: helm.toolkit.fluxcd.io/v2
        kind: HelmRelease
        metadata:
          name: cert-manager
          namespace: greenhouse
        spec:
          interval: 10m
          targetNamespace: cert-manager
          install:
            createNamespace: true
            crds: CreateReplace
          upgrade:
            crds: CreateReplace
          chartRef:
            kind: OCIRepository
            name: cert-manager-bootstrap
            namespace: greenhouse
          values:
            installCRDs: true

    # ── OCM controller ────────────────────────────────────────────────────────
    # Pulled from the RBSC. Path derived from component-constructor.yaml:
    #   access.type: ociArtifact
    #   imageReference: ghcr.io/open-component-model/helm/ocm-controller:v${version}
    # --copy-resources strips the source host and writes the blob to:
    #   <rbscRegistry>/open-component-model/helm/ocm-controller
    # MUST depend on cert-manager — OCM controller uses cert-manager for webhook TLS.
    # MUST set tlsCert.generateTlsCert=true — without it the internal registry has no
    # TLS cert and all Flux OCIRepository pulls from registry.ocm-system... fail.
    - id: ocmControllerOCIRepo
      template:
        apiVersion: source.toolkit.fluxcd.io/v1
        kind: OCIRepository
        metadata:
          name: ocm-controller-bootstrap
          namespace: greenhouse
        spec:
          interval: 10m
          url: "oci://${schema.spec.rbscRegistry}/open-component-model/helm/ocm-controller"
          ref:
            tag: "v${schema.spec.ocmControllerVersion}"
          secretRef:
            name: "${schema.spec.registrySecretName}"

    - id: ocmControllerHR
      template:
        apiVersion: helm.toolkit.fluxcd.io/v2
        kind: HelmRelease
        metadata:
          name: ocm-controller
          namespace: greenhouse
        spec:
          interval: 10m
          targetNamespace: ocm-system
          install:
            createNamespace: true
          dependsOn:
            - name: cert-manager
              namespace: greenhouse
          chartRef:
            kind: OCIRepository
            name: ocm-controller-bootstrap
            namespace: greenhouse
          values:
            tlsCert:
              generateTlsCert: true
