# kro ResourceGraphDefinition for Greenhouse
#
# Applied directly to the cluster via kustomize (deploy/kustomization.yaml).
# When kro processes this RGD it creates the GreenhouseStack CRD.
# Apply the GreenhouseStack instance separately: make -f Makefile.ocm deploy-instance
#
# NOTE: kind: Deployer (OCM) requires OCM controller > v0.33.0 (SAP-internal build).
# On OCM controller v0.33.0 (public), this file is applied directly via kustomization.
#
# Schema uses kro v0.9.x SimpleSchema syntax (inline type strings, not {type: string}).
# Status fields use CEL expressions projecting from managed HelmRelease conditions.
apiVersion: kro.run/v1alpha1
kind: ResourceGraphDefinition
metadata:
  name: greenhouse-stack
  namespace: greenhouse
spec:
  schema:
    apiVersion: v1alpha1
    kind: GreenhouseStack
    spec:
      registryHost: "string"
      imageRegistry: "string"
      certManagerSnapshotPath: "string"
      certManagerVersion: "string"
      ocmControllerSnapshotPath: "string"
      ocmControllerVersion: "string"
      greenhouseSnapshotPath: "string"
      greenhouseVersion: "string"
      # Image content digests from the OCM-signed bundle (Option 1 digest pinning).
      # Pods run by @sha256 so the Kyverno allowlist can enforce "only signed content runs".
      # greenhouseImageDigest pins the shared greenhouse binary (manager/idproxy/cors-proxy/authz).
      # dashboardImageDigest pins the dashboard UI image. Format: "sha256:<hex>".
      # Get values from: make -f Makefile.ocm print-image-digests
      greenhouseImageDigest: "string"
      dashboardImageDigest: "string"
      tlsSecretName: "string"
      valuesSecretName: "string"

    status:
      certManagerReady: "${certManagerHR.status.conditions[0].status}"
      ocmControllerReady: "${ocmControllerHR.status.conditions[0].status}"
      greenhouseReady: "${greenhouseHR.status.conditions[0].status}"

  resources:

    - id: certManagerOCIRepo
      template:
        apiVersion: source.toolkit.fluxcd.io/v1
        kind: OCIRepository
        metadata:
          name: cert-manager
          namespace: greenhouse
        spec:
          interval: 10m
          url: "oci://${schema.spec.registryHost}/${schema.spec.certManagerSnapshotPath}"
          ref:
            tag: "${schema.spec.certManagerVersion}"
          certSecretRef:
            name: "${schema.spec.tlsSecretName}"

    - id: certManagerHR
      template:
        apiVersion: helm.toolkit.fluxcd.io/v2
        kind: HelmRelease
        metadata:
          name: cert-manager
          namespace: greenhouse
        spec:
          interval: 10m
          targetNamespace: cert-manager
          install:
            createNamespace: true
            crds: CreateReplace
          upgrade:
            crds: CreateReplace
          chartRef:
            kind: OCIRepository
            name: cert-manager
            namespace: greenhouse
          values:
            installCRDs: true

    - id: ocmControllerOCIRepo
      template:
        apiVersion: source.toolkit.fluxcd.io/v1
        kind: OCIRepository
        metadata:
          name: ocm-controller
          namespace: greenhouse
        spec:
          interval: 10m
          url: "oci://${schema.spec.registryHost}/${schema.spec.ocmControllerSnapshotPath}"
          ref:
            tag: "${schema.spec.ocmControllerVersion}"
          certSecretRef:
            name: "${schema.spec.tlsSecretName}"

    - id: ocmControllerHR
      template:
        apiVersion: helm.toolkit.fluxcd.io/v2
        kind: HelmRelease
        metadata:
          name: ocm-controller
          namespace: greenhouse
        spec:
          interval: 10m
          targetNamespace: ocm-system
          install:
            createNamespace: true
          dependsOn:
            - name: cert-manager
              namespace: greenhouse
          chartRef:
            kind: OCIRepository
            name: ocm-controller
            namespace: greenhouse

    - id: greenhouseOCIRepo
      template:
        apiVersion: source.toolkit.fluxcd.io/v1
        kind: OCIRepository
        metadata:
          name: greenhouse
          namespace: greenhouse
        spec:
          interval: 10m
          url: "oci://${schema.spec.registryHost}/${schema.spec.greenhouseSnapshotPath}"
          ref:
            tag: "${schema.spec.greenhouseVersion}"
          certSecretRef:
            name: "${schema.spec.tlsSecretName}"
          # NOTE on signature verification (see ../keyless-signing.md §5):
          # spec.verify is intentionally ABSENT. These OCIRepositories pull OCM
          # *Snapshots* from the in-cluster registry — freshly repackaged, unsigned
          # artifacts. The original CI chart signature does NOT survive OCM extraction,
          # so `verify: {provider: cosign}` here would ALWAYS fail. Chart integrity is
          # attested at the OCM layer instead (`make verify-sigstore`).
          #
          # IF you ever switch to Flux pulling charts DIRECTLY from the signed RBSC
          # registry (no OCM Snapshot indirection), THEN add (match your OIDC login):
          #   verify:
          #     provider: cosign
          #     matchOIDCIdentity:
          #       - issuer: "^https://accounts.google.com$"
          #         subject: "^you@sap.com$"

    - id: greenhouseHR
      template:
        apiVersion: helm.toolkit.fluxcd.io/v2
        kind: HelmRelease
        metadata:
          name: greenhouse
          namespace: greenhouse
        spec:
          interval: 10m
          targetNamespace: greenhouse
          dependsOn:
            - name: cert-manager
              namespace: greenhouse
            - name: ocm-controller
              namespace: greenhouse
          chartRef:
            kind: OCIRepository
            name: greenhouse
            namespace: greenhouse
          valuesFrom:
            - kind: Secret
              name: "greenhouse-values"
              valuesKey: values.yaml
              optional: false
          values:
            # Image digest pinning (Option 1). Each subchart's _helpers.tpl renders
            # repository@digest when image.digest is set (digest takes precedence over tag),
            # so pods run by @sha256 — exactly the content the OCM signature covers.
            # manager/idproxy/cors-proxy/authz share the one greenhouse binary image → one digest.
            manager:
              controllerManager:
                image:
                  repository: "${schema.spec.imageRegistry}/cloudoperators/greenhouse"
                  digest: "${schema.spec.greenhouseImageDigest}"
            idproxy:
              image:
                repository: "${schema.spec.imageRegistry}/cloudoperators/greenhouse"
                digest: "${schema.spec.greenhouseImageDigest}"
            cors-proxy:
              image:
                repository: "${schema.spec.imageRegistry}/cloudoperators/greenhouse"
                digest: "${schema.spec.greenhouseImageDigest}"
            authz:
              image:
                repository: "${schema.spec.imageRegistry}/cloudoperators/greenhouse"
                digest: "${schema.spec.greenhouseImageDigest}"
            dashboard:
              image:
                repository: "${schema.spec.imageRegistry}/cloudoperators/juno-app-greenhouse"
                digest: "${schema.spec.dashboardImageDigest}"
            # postgresql-ng: sapcc image, pulled by tag — NO digest knob, NOT an OCM resource.
            # It cannot be digest-pinned and is not covered by the OCM signature; the Kyverno
            # policy exempts it by registry+tag. See keyless-signing-discussion.md §6.
            postgresqlng:
              global:
                registry: "${schema.spec.imageRegistry}/sapcc"
