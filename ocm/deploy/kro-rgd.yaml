# kro ResourceGraphDefinition for Greenhouse
#
# Applied directly to the cluster via kustomize (deploy/kustomization.yaml).
# When kro processes this RGD it creates the GreenhouseStack CRD.
# Apply the GreenhouseStack instance separately: make -f Makefile.ocm deploy-instance
#
# Resource graph: Repository → Component → Resource → OCIRepository → HelmRelease
#
# The new OCM controller (open-component-model/open-component-model v0.21.0+) has no
# local in-cluster registry. Resource.status.additional.oci exposes the resolved OCI
# URL directly via additionalStatusFields CEL. The OCIRepository reads that URL and
# pulls the chart from the on-site registry — no manual path copying required.
#
# Schema uses kro v0.9.x SimpleSchema syntax (inline type strings, not {type: string}).
# readyWhen conditions on each resource gate downstream resource creation.
apiVersion: kro.run/v1alpha1
kind: ResourceGraphDefinition
metadata:
  name: greenhouse-stack
  namespace: greenhouse
spec:
  schema:
    apiVersion: v1alpha1
    kind: GreenhouseStack
    spec:
      # On-site OCI registry base URL — the air-gapped registry your cluster can reach.
      # After `ocm transfer ctf --copy-resources`, all charts and images live here.
      onSiteRegistry: "string"
      # docker-registry secret name in the greenhouse namespace for on-site registry auth.
      registrySecretName: "string"
      # Semver constraint for the greenhouse OCM component, e.g. ">=0.23.0"
      componentVersion: "string"
      # Image content digests from the OCM-signed bundle (digest pinning).
      # Pods run by @sha256 so the digest enforces "only signed content runs".
      # greenhouseImageDigest pins the shared greenhouse binary (manager/idproxy/cors-proxy/authz).
      # dashboardImageDigest pins the dashboard UI image. Format: "sha256:<hex>".
      # Get current values with: make -f Makefile.ocm print-image-digests
      greenhouseImageDigest: "string"
      dashboardImageDigest: "string"
      # Registry prefix for postgres images after OCM transfer, e.g. "<on-site>/sapcc"
      postgresImageRegistry: "string"
      # Secret in the greenhouse namespace that holds values.yaml for the greenhouse HelmRelease.
      valuesSecretName: "string"
      # Set false when cert-manager/ocm-controller are pre-installed but NOT managed via a
      # kro GreenhouseBootstrap HelmRelease (i.e. no cert-manager or ocm-k8s-toolkit HR in
      # the greenhouse namespace). When true, the greenhouse HelmRelease waits for those
      # bootstrap HelmReleases to be Ready.
      enableCertManager: "boolean"
      enableOcmController: "boolean"

    status:
      greenhouseReady: "${greenhouseHR.status.conditions[0].status}"

  resources:

    # ── OCM Repository ────────────────────────────────────────────────────
    # Points at the on-site OCI registry where the OCM bundle was transferred.
    - id: greenhouseRepository
      readyWhen:
        - "${greenhouseRepository.status.conditions.exists(c, c.type == 'Ready' && c.status == 'True')}"
      template:
        apiVersion: delivery.ocm.software/v1alpha1
        kind: Repository
        metadata:
          name: greenhouse-repository
          namespace: greenhouse
        spec:
          interval: 10m
          repositorySpec:
            baseUrl: "${schema.spec.onSiteRegistry}"
            type: OCIRegistry
          ocmConfig:
            - kind: Secret
              name: "${schema.spec.registrySecretName}"
              policy: Propagate

    # ── OCM Component ─────────────────────────────────────────────────────
    # Resolves the greenhouse component version from the semver constraint.
    - id: greenhouseComponent
      readyWhen:
        - "${greenhouseComponent.status.conditions.exists(c, c.type == 'Ready' && c.status == 'True')}"
      template:
        apiVersion: delivery.ocm.software/v1alpha1
        kind: Component
        metadata:
          name: greenhouse-component
          namespace: greenhouse
        spec:
          interval: 10m
          component: github.com/cloudoperators/greenhouse
          semver: "${schema.spec.componentVersion}"
          repositoryRef:
            name: "${greenhouseRepository.metadata.name}"

    # ── OCM Resource ──────────────────────────────────────────────────────
    # Extracts the greenhouse-chart resource from the core sub-component.
    # additionalStatusFields exposes the resolved OCI URL (registry, repository, digest)
    # which the OCIRepository below consumes — no manual path copying required.
    - id: greenhouseChartResource
      readyWhen:
        - "${greenhouseChartResource.status.conditions.exists(c, c.type == 'Ready' && c.status == 'True')}"
      template:
        apiVersion: delivery.ocm.software/v1alpha1
        kind: Resource
        metadata:
          name: greenhouse-chart
          namespace: greenhouse
        spec:
          componentRef:
            name: "${greenhouseComponent.metadata.name}"
          resource:
            byReference:
              resource:
                name: greenhouse-chart
              referencePath:
                - name: core
          additionalStatusFields:
            oci: resource.access.toOCI()

    # ── Flux OCIRepository ────────────────────────────────────────────────
    # URL and digest derived from Resource.status.additional.oci — fully automatic.
    # layerSelector targets the Helm chart layer specifically.
    - id: greenhouseOCIRepo
      readyWhen:
        - "${greenhouseOCIRepo.status.conditions.exists(c, c.type == 'Ready' && c.status == 'True')}"
      template:
        apiVersion: source.toolkit.fluxcd.io/v1
        kind: OCIRepository
        metadata:
          name: greenhouse
          namespace: greenhouse
        spec:
          interval: 10m
          url: "oci://${greenhouseChartResource.status.additional.oci.registry}/${greenhouseChartResource.status.additional.oci.repository}"
          ref:
            digest: "${greenhouseChartResource.status.additional.oci.digest}"
          layerSelector:
            mediaType: "application/vnd.cncf.helm.chart.content.v1.tar+gzip"
            operation: copy
          secretRef:
            name: "${schema.spec.registrySecretName}"

    # ── Flux HelmRelease ──────────────────────────────────────────────────
    # chartRef.name references the OCIRepository above.
    # image.repository overrides point all pods at the on-site registry — air-gap guarantee.
    # image.digest pins the exact content from the OCM-signed bundle.
    - id: greenhouseHR
      readyWhen:
        - "${greenhouseHR.status.conditions.exists(c, c.type == 'Ready' && c.status == 'True')}"
      template:
        apiVersion: helm.toolkit.fluxcd.io/v2
        kind: HelmRelease
        metadata:
          name: greenhouse
          namespace: greenhouse
        spec:
          interval: 10m
          targetNamespace: greenhouse
          chartRef:
            kind: OCIRepository
            name: "${greenhouseOCIRepo.metadata.name}"
            namespace: greenhouse
          dependsOn: '${(schema.spec.enableCertManager ? [{"name":"cert-manager","namespace":"greenhouse"}] : []) + (schema.spec.enableOcmController ? [{"name":"ocm-k8s-toolkit","namespace":"greenhouse"}] : [])}'
          valuesFrom:
            - kind: Secret
              name: "${schema.spec.valuesSecretName}"
              valuesKey: values.yaml
              optional: false
          values:
            manager:
              controllerManager:
                image:
                  repository: "${schema.spec.onSiteRegistry}/cloudoperators/greenhouse"
                  digest: "${schema.spec.greenhouseImageDigest}"
            idproxy:
              image:
                repository: "${schema.spec.onSiteRegistry}/cloudoperators/greenhouse"
                digest: "${schema.spec.greenhouseImageDigest}"
            cors-proxy:
              image:
                repository: "${schema.spec.onSiteRegistry}/cloudoperators/greenhouse"
                digest: "${schema.spec.greenhouseImageDigest}"
            authz:
              image:
                repository: "${schema.spec.onSiteRegistry}/cloudoperators/greenhouse"
                digest: "${schema.spec.greenhouseImageDigest}"
            dashboard:
              image:
                repository: "${schema.spec.onSiteRegistry}/cloudoperators/juno-app-greenhouse"
                digest: "${schema.spec.dashboardImageDigest}"
            postgresqlng:
              global:
                registry: "${schema.spec.postgresImageRegistry}"
