# kro ResourceGraphDefinition for Greenhouse
#
# Applied directly to the cluster via kustomize (deploy/kustomization.yaml).
# When kro processes this RGD it creates the GreenhouseStack CRD.
# Apply the GreenhouseStack instance separately: make -f Makefile.ocm deploy-instance
#
# Resource graph: ComponentVersion → Resource → FluxDeployer → HelmRelease
#
# FluxDeployer is used ONLY for OCIRepository creation:
#   - sourceRef: kind: Resource reads Resource.status.snapshotName → Snapshot →
#     Snapshot.status.repositoryURL → correct sha-... OCI path in the in-cluster registry
#   - helmReleaseTemplate is intentionally OMITTED: FluxDeployer v0.33.0 ignores
#     helmReleaseTemplate.spec when creating the HelmRelease (only chartRef is propagated).
#     Without helmReleaseTemplate, FluxDeployer creates only the OCIRepository.
# The HelmRelease is managed directly by kro so valuesFrom, values (digest pinning),
# dependsOn, and targetNamespace are all under kro's control.
# HelmRelease.chartRef.name references "${greenhouseFluxDeployer.metadata.name}" to
# pick up the OCIRepository created by FluxDeployer and gate on FluxDeployer readiness.
#
# Schema uses kro v0.9.x SimpleSchema syntax (inline type strings, not {type: string}).
# readyWhen conditions on each resource gate downstream resource creation.
apiVersion: kro.run/v1alpha1
kind: ResourceGraphDefinition
metadata:
  name: greenhouse-stack
  namespace: greenhouse
spec:
  schema:
    apiVersion: v1alpha1
    kind: GreenhouseStack
    spec:
      # RBSC registry base URL, e.g. "ghcr.io/sofiyadesaisap/greenhouse-rbsc"
      # Used as ComponentVersion repository URL and image registry prefix for digest pinning.
      imageRegistry: "string"
      # docker-registry secret name in the greenhouse namespace (RBSC auth)
      registrySecretName: "string"
      # Semver constraint for the greenhouse OCM component, e.g. ">=0.23.0"
      componentVersion: "string"
      # Image content digests from the OCM-signed bundle (Option 1 digest pinning).
      # Pods run by @sha256 so the Kyverno allowlist enforces "only signed content runs".
      # greenhouseImageDigest pins the shared greenhouse binary (manager/idproxy/cors-proxy/authz).
      # dashboardImageDigest pins the dashboard UI image. Format: "sha256:<hex>".
      # Get current values with: make -f Makefile.ocm print-image-digests
      greenhouseImageDigest: "string"
      dashboardImageDigest: "string"
      # Secret in the greenhouse namespace that holds values.yaml for the greenhouse HelmRelease.
      valuesSecretName: "string"
      # Set false when cert-manager/ocm-controller are pre-installed but NOT managed via a
      # kro GreenhouseBootstrap HelmRelease (i.e. no cert-manager HR in the greenhouse namespace).
      # When true, the greenhouse HelmRelease waits for those bootstrap HelmReleases to be Ready.
      enableCertManager: "boolean"
      enableOcmController: "boolean"

    status:
      greenhouseReady: "${greenhouseHR.status.conditions[0].status}"

  resources:

    # ── OCM ComponentVersion ──────────────────────────────────────────────
    # Points at the greenhouse product component in the RBSC registry.
    - id: greenhouseComponentVersion
      readyWhen:
        - "${greenhouseComponentVersion.status.conditions.exists(c, c.type == 'Ready' && c.status == 'True')}"
      template:
        apiVersion: delivery.ocm.software/v1alpha1
        kind: ComponentVersion
        metadata:
          name: greenhouse
          namespace: greenhouse
        spec:
          interval: 10m
          component: github.com/cloudoperators/greenhouse
          version:
            semver: "${schema.spec.componentVersion}"
          repository:
            url: "${schema.spec.imageRegistry}"
            secretRef:
              name: "${schema.spec.registrySecretName}"

    # ── OCM Resource ──────────────────────────────────────────────────────
    # Uses the v0.33.0 API: resourceRef and referencePath are inside sourceRef.
    # Navigates root component → core sub-component → greenhouse-chart resource.
    # Creates a Snapshot; status.snapshotName is read by the FluxDeployer below.
    - id: greenhouseChartResource
      readyWhen:
        - "${greenhouseChartResource.status.conditions.exists(c, c.type == 'Ready' && c.status == 'True')}"
      template:
        apiVersion: delivery.ocm.software/v1alpha1
        kind: Resource
        metadata:
          name: greenhouse-chart
          namespace: greenhouse
        spec:
          interval: 10m
          sourceRef:
            apiVersion: delivery.ocm.software/v1alpha1
            kind: ComponentVersion
            name: "${greenhouseComponentVersion.metadata.name}"
            namespace: greenhouse
            resourceRef:
              name: greenhouse-chart
              referencePath:
                - name: core

    # ── OCM FluxDeployer ──────────────────────────────────────────────────
    # Creates an OCIRepository only (helmReleaseTemplate intentionally omitted).
    # The controller reads Resource.status.snapshotName → Snapshot → repositoryURL
    # and creates an OCIRepository named after the FluxDeployer ("greenhouse") with
    # the correct OCI path (sha-... in the in-cluster registry).
    # helmReleaseTemplate is omitted because FluxDeployer v0.33.0 does not propagate
    # helmReleaseTemplate.spec to the HelmRelease it creates — only chartRef is set.
    # The HelmRelease below is managed directly by kro with full values.
    - id: greenhouseFluxDeployer
      readyWhen:
        - "${greenhouseFluxDeployer.status.conditions.exists(c, c.type == 'Ready' && c.status == 'True')}"
      template:
        apiVersion: delivery.ocm.software/v1alpha1
        kind: FluxDeployer
        metadata:
          name: greenhouse
          namespace: greenhouse
        spec:
          interval: 10m
          sourceRef:
            apiVersion: delivery.ocm.software/v1alpha1
            kind: Resource
            name: "${greenhouseChartResource.metadata.name}"
            namespace: greenhouse

    # ── Flux HelmRelease ──────────────────────────────────────────────────
    # chartRef.name references "${greenhouseFluxDeployer.metadata.name}" which resolves
    # to "greenhouse" — the name of the OCIRepository created by FluxDeployer above.
    # This also gates kro: HelmRelease is not created until FluxDeployer is Ready
    # (meaning the OCIRepository exists and has a valid artifact).
    - id: greenhouseHR
      readyWhen:
        - "${greenhouseHR.status.conditions.exists(c, c.type == 'Ready' && c.status == 'True')}"
      template:
        apiVersion: helm.toolkit.fluxcd.io/v2
        kind: HelmRelease
        metadata:
          name: greenhouse
          namespace: greenhouse
        spec:
          interval: 10m
          targetNamespace: greenhouse
          chartRef:
            kind: OCIRepository
            name: "${greenhouseFluxDeployer.metadata.name}"
            namespace: greenhouse
          dependsOn: '${(schema.spec.enableCertManager ? [{"name":"cert-manager","namespace":"greenhouse"}] : []) + (schema.spec.enableOcmController ? [{"name":"ocm-controller","namespace":"greenhouse"}] : [])}'
          postRenderers:
            - kustomize:
                patches:
                  - target:
                      kind: Deployment
                    patch: |
                      - op: add
                        path: /spec/template/spec/imagePullSecrets
                        value:
                          - name: "${schema.spec.registrySecretName}"
          valuesFrom:
            - kind: Secret
              name: "${schema.spec.valuesSecretName}"
              valuesKey: values.yaml
              optional: false
          values:
            manager:
              controllerManager:
                image:
                  repository: "${schema.spec.imageRegistry}/cloudoperators/greenhouse"
                  digest: "${schema.spec.greenhouseImageDigest}"
            idproxy:
              image:
                repository: "${schema.spec.imageRegistry}/cloudoperators/greenhouse"
                digest: "${schema.spec.greenhouseImageDigest}"
            cors-proxy:
              image:
                repository: "${schema.spec.imageRegistry}/cloudoperators/greenhouse"
                digest: "${schema.spec.greenhouseImageDigest}"
            authz:
              image:
                repository: "${schema.spec.imageRegistry}/cloudoperators/greenhouse"
                digest: "${schema.spec.greenhouseImageDigest}"
            dashboard:
              image:
                repository: "${schema.spec.imageRegistry}/cloudoperators/juno-app-greenhouse"
                digest: "${schema.spec.dashboardImageDigest}"
            postgresqlng:
              global:
                registry: "${schema.spec.imageRegistry}/sapcc"
