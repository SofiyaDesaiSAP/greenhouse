# Resource objects extract individual Helm charts from the greenhouse OCM bundle.
# The OCM controller creates a Snapshot OCI artifact for each Resource.
#
# referencePath navigates the componentReference tree:
#   greenhouse (top-level)
#     └─ core            → greenhouse-chart, kro-rgd
#     └─ cert-manager    → cert-manager-chart
#     └─ kro             → kro-chart
#     └─ ocm-controller  → ocm-controller-chart
#
# greenhouse-stack-rgd holds the kro ResourceGraphDefinition YAML.
# The Deployer in graph-deployer.yaml applies it directly (no Helm HelmRelease).
# kro processes the RGD → creates GreenhouseStack CRD → apply instance.yaml.

# ---- cert-manager ----
apiVersion: delivery.ocm.software/v1alpha1
kind: Resource
metadata:
  name: cert-manager-chart
  namespace: greenhouse
spec:
  interval: 10m
  sourceRef:
    kind: ComponentVersion
    name: greenhouse
    namespace: greenhouse
    resourceRef:
      name: cert-manager-chart
      referencePath:
        - name: cert-manager
---
# ---- kro ----
apiVersion: delivery.ocm.software/v1alpha1
kind: Resource
metadata:
  name: kro-chart
  namespace: greenhouse
spec:
  interval: 10m
  sourceRef:
    kind: ComponentVersion
    name: greenhouse
    namespace: greenhouse
    resourceRef:
      name: kro-chart
      referencePath:
        - name: kro
---
# ---- ocm-controller ----
apiVersion: delivery.ocm.software/v1alpha1
kind: Resource
metadata:
  name: ocm-controller-chart
  namespace: greenhouse
spec:
  interval: 10m
  sourceRef:
    kind: ComponentVersion
    name: greenhouse
    namespace: greenhouse
    resourceRef:
      name: ocm-controller-chart
      referencePath:
        - name: ocm-controller
---
# ---- greenhouse core chart ----
apiVersion: delivery.ocm.software/v1alpha1
kind: Resource
metadata:
  name: greenhouse-chart
  namespace: greenhouse
spec:
  interval: 10m
  sourceRef:
    kind: ComponentVersion
    name: greenhouse
    namespace: greenhouse
    resourceRef:
      name: greenhouse-chart
      referencePath:
        - name: core
---
# ---- greenhouse-stack kro RGD (plain YAML, applied by Deployer) ----
apiVersion: delivery.ocm.software/v1alpha1
kind: Resource
metadata:
  name: greenhouse-stack-rgd
  namespace: greenhouse
spec:
  interval: 10m
  sourceRef:
    kind: ComponentVersion
    name: greenhouse
    namespace: greenhouse
    resourceRef:
      name: kro-rgd
      referencePath:
        - name: core
