# DEPRECATED — superseded by the FluxDeployer resource in ocm/deploy/kro-rgd.yaml.
# The kro RGD's FluxDeployer navigates ComponentVersion → Resource → Snapshot
# automatically via sourceRef.resourceRef + referencePath, so no separate
# Resource CR is needed. Applying this file would create a duplicate CR.
# Retained for reference only; do NOT include in kustomization.yaml.
#
# OCM Resource — previously applied via kustomize (deploy/kustomization.yaml).
# Extracts the greenhouse-chart artifact from the ComponentVersion and creates
# a Snapshot in the in-cluster OCM registry for Flux to consume.
apiVersion: delivery.ocm.software/v1alpha1
kind: Resource
metadata:
  name: greenhouse-chart
  namespace: greenhouse
spec:
  interval: 10m
  sourceRef:
    apiVersion: delivery.ocm.software/v1alpha1
    kind: ComponentVersion
    name: greenhouse
    namespace: greenhouse
  resource:
    name: greenhouse-chart
  referencePath:
    - name: core
