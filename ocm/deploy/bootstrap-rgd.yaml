# kro ResourceGraphDefinition for Greenhouse Bootstrap
#
# Installs cluster prerequisites (Flux, kro, cert-manager, prometheus-operator CRDs,
# OCM controller) via kro + Flux, pulling charts from the on-site registry
# or public OCI where noted.
#
# After `ocm transfer ctf --copy-resources`, the on-site registry holds Helm chart blobs
# at paths derived from OCM's path-preservation rule (source registry host is stripped):
#   cert-manager:    oci://<on-site>/cloudoperators/greenhouse-extensions/charts/cert-manager
#   ocm-controller:  oci://<on-site>/open-component-model/kubernetes/controller/chart
#
# prometheus-operator-crds is NOT in the OCM bundle (greenhouse unconditionally creates
# PrometheusRule resources, but prometheus-crds is not an OCM component).
# kro and Flux pull from their public OCI registries.
#
# Applied via kustomize (deploy/kustomization.yaml).
# When kro processes this RGD it registers the GreenhouseBootstrap CRD.
# Apply the instance separately: kubectl apply -f deploy/bootstrap-instance.yaml
#
# Bootstrapping constraint: Flux must exist before any HelmRelease reconciles,
# and kro must exist before this RGD can be processed. enableFlux: true and
# enableKro: true therefore require those components to already be present.
# These flags are most useful as false (skip re-installing something already there).
#
# Schema uses kro v0.9.x SimpleSchema syntax (inline type strings, not {type: string}).
# Status fields use CEL expressions projecting from managed HelmRelease conditions.
apiVersion: kro.run/v1alpha1
kind: ResourceGraphDefinition
metadata:
  name: greenhouse-bootstrap
  namespace: greenhouse
spec:
  schema:
    apiVersion: v1alpha1
    kind: GreenhouseBootstrap
    spec:
      # On-site OCI registry base URL (same as onSiteRegistry in kro-rgd.yaml).
      onSiteRegistry: "string"
      # Name of the docker-registry secret in the greenhouse namespace for on-site registry auth.
      registrySecretName: "string"
      certManagerVersion: "string"
      # prometheus-operator-crds is NOT in the OCM bundle — pulls from public OCI.
      prometheusCrdsVersion: "string"
      ocmControllerVersion: "string"
      kroVersion: "string"
      fluxVersion: "string"
      # Master switch — set false to suspend ALL components (overrides per-component flags).
      installPrerequisites: "boolean"
      # Per-component flags — set false to skip a component already present in the cluster.
      # When false, the OCIRepository and HelmRelease are created but immediately suspended.
      installCertManager:    "boolean"
      installOcmController:  "boolean"
      installPrometheusCrds: "boolean"
      # enableKro / enableFlux: most useful as false (skip re-installing existing installs).
      # See bootstrapping constraint in file header before setting true.
      enableKro:  "boolean"
      enableFlux: "boolean"

    status:
      certManagerReady:  "${certManagerHR.status.conditions[0].status}"
      ocmControllerReady: "${ocmControllerHR.status.conditions[0].status}"

  resources:

    # ── prometheus-operator CRDs ─────────────────────────────────────────
    # Not in the OCM bundle; pulled from public OCI.
    # Required because the greenhouse chart creates PrometheusRule resources
    # unconditionally — without this CRD the greenhouse HelmRelease fails.
    - id: prometheusOCIRepo
      template:
        apiVersion: source.toolkit.fluxcd.io/v1
        kind: OCIRepository
        metadata:
          name: prometheus-crds-bootstrap
          namespace: greenhouse
        spec:
          interval: 10m
          suspend: ${!(schema.spec.installPrerequisites && schema.spec.installPrometheusCrds)}
          url: "oci://ghcr.io/prometheus-community/charts/prometheus-operator-crds"
          ref:
            tag: "${schema.spec.prometheusCrdsVersion}"

    - id: prometheusHR
      template:
        apiVersion: helm.toolkit.fluxcd.io/v2
        kind: HelmRelease
        metadata:
          name: prometheus-crds
          namespace: greenhouse
        spec:
          interval: 10m
          suspend: ${!(schema.spec.installPrerequisites && schema.spec.installPrometheusCrds)}
          targetNamespace: monitoring
          install:
            createNamespace: true
          chartRef:
            kind: OCIRepository
            name: prometheus-crds-bootstrap
            namespace: greenhouse

    # ── cert-manager ─────────────────────────────────────────────────────
    # Pulled from the on-site registry. Path derived from greenhouse-prerequisites-component.yaml:
    #   access.type: ociArtifact
    #   imageReference: ghcr.io/cloudoperators/greenhouse-extensions/charts/cert-manager:${version}
    # --copy-resources strips the source host and writes the blob to:
    #   <onSiteRegistry>/cloudoperators/greenhouse-extensions/charts/cert-manager
    - id: certManagerOCIRepo
      template:
        apiVersion: source.toolkit.fluxcd.io/v1
        kind: OCIRepository
        metadata:
          name: cert-manager-bootstrap
          namespace: greenhouse
        spec:
          interval: 10m
          suspend: ${!(schema.spec.installPrerequisites && schema.spec.installCertManager)}
          url: "oci://${schema.spec.onSiteRegistry}/cloudoperators/greenhouse-extensions/charts/cert-manager"
          ref:
            tag: "${schema.spec.certManagerVersion}"
          secretRef:
            name: "${schema.spec.registrySecretName}"

    - id: certManagerHR
      template:
        apiVersion: helm.toolkit.fluxcd.io/v2
        kind: HelmRelease
        metadata:
          name: cert-manager
          namespace: greenhouse
        spec:
          interval: 10m
          suspend: ${!(schema.spec.installPrerequisites && schema.spec.installCertManager)}
          targetNamespace: cert-manager
          install:
            createNamespace: true
            crds: CreateReplace
          upgrade:
            crds: CreateReplace
          chartRef:
            kind: OCIRepository
            name: cert-manager-bootstrap
            namespace: greenhouse
          values:
            installCRDs: true

    # ── OCM controller (open-component-model v0.21.0+) ────────────────────
    # Pulled from the on-site registry. Path derived from greenhouse-prerequisites-component.yaml:
    #   access.type: ociArtifact
    #   imageReference: ghcr.io/open-component-model/kubernetes/controller/chart:${version}
    # --copy-resources strips the source host and writes the blob to:
    #   <onSiteRegistry>/open-component-model/kubernetes/controller/chart
    # The new controller has no local in-cluster registry — no cert-manager dependency,
    # no TLS cert required.
    - id: ocmControllerOCIRepo
      template:
        apiVersion: source.toolkit.fluxcd.io/v1
        kind: OCIRepository
        metadata:
          name: ocm-controller-bootstrap
          namespace: greenhouse
        spec:
          interval: 10m
          suspend: ${!(schema.spec.installPrerequisites && schema.spec.installOcmController)}
          url: "oci://${schema.spec.onSiteRegistry}/open-component-model/kubernetes/controller/chart"
          ref:
            tag: "${schema.spec.ocmControllerVersion}"
          secretRef:
            name: "${schema.spec.registrySecretName}"

    - id: ocmControllerHR
      template:
        apiVersion: helm.toolkit.fluxcd.io/v2
        kind: HelmRelease
        metadata:
          name: ocm-k8s-toolkit
          namespace: greenhouse
        spec:
          interval: 10m
          suspend: ${!(schema.spec.installPrerequisites && schema.spec.installOcmController)}
          targetNamespace: ocm-k8s-toolkit-system
          install:
            createNamespace: true
          chartRef:
            kind: OCIRepository
            name: ocm-controller-bootstrap
            namespace: greenhouse

    # ── kro ───────────────────────────────────────────────────────────────
    # Pulled from public OCI (registry.k8s.io).
    # See bootstrapping constraint in file header before setting enableKro: true.
    - id: kroOCIRepo
      template:
        apiVersion: source.toolkit.fluxcd.io/v1
        kind: OCIRepository
        metadata:
          name: kro-bootstrap
          namespace: greenhouse
        spec:
          interval: 10m
          suspend: ${!(schema.spec.installPrerequisites && schema.spec.enableKro)}
          url: "oci://registry.k8s.io/kro/charts/kro"
          ref:
            tag: "${schema.spec.kroVersion}"

    - id: kroHR
      template:
        apiVersion: helm.toolkit.fluxcd.io/v2
        kind: HelmRelease
        metadata:
          name: kro
          namespace: greenhouse
        spec:
          interval: 10m
          suspend: ${!(schema.spec.installPrerequisites && schema.spec.enableKro)}
          targetNamespace: kro-system
          install:
            createNamespace: true
          chartRef:
            kind: OCIRepository
            name: kro-bootstrap
            namespace: greenhouse

    # ── Flux ──────────────────────────────────────────────────────────────
    # Pulled from public OCI (ghcr.io/fluxcd-community/charts/flux2).
    # See bootstrapping constraint in file header before setting enableFlux: true.
    - id: fluxOCIRepo
      template:
        apiVersion: source.toolkit.fluxcd.io/v1
        kind: OCIRepository
        metadata:
          name: flux-bootstrap
          namespace: greenhouse
        spec:
          interval: 10m
          suspend: ${!(schema.spec.installPrerequisites && schema.spec.enableFlux)}
          url: "oci://ghcr.io/fluxcd-community/charts/flux2"
          ref:
            tag: "${schema.spec.fluxVersion}"

    - id: fluxHR
      template:
        apiVersion: helm.toolkit.fluxcd.io/v2
        kind: HelmRelease
        metadata:
          name: flux
          namespace: greenhouse
        spec:
          interval: 10m
          suspend: ${!(schema.spec.installPrerequisites && schema.spec.enableFlux)}
          targetNamespace: flux-system
          install:
            createNamespace: true
          chartRef:
            kind: OCIRepository
            name: flux-bootstrap
            namespace: greenhouse
