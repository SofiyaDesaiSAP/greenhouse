# GreenhouseBootstrap Instance — applied SEPARATELY after kro has processed the
# bootstrap RGD and registered the GreenhouseBootstrap CRD.
#
# Apply with:
#   kubectl get crd greenhousebootstraps.kro.run   # wait for this
#   kubectl apply -f deploy/bootstrap-instance.yaml
#
# kro expands this into OCIRepositories + HelmReleases.
#
# The RBSC registry secret (registrySecretName) must exist in the greenhouse namespace
# before this instance is applied. Create it during bootstrap preparation:
#   kubectl create secret docker-registry greenhouse-ocm-registry-creds \
#     --docker-server=ghcr.io \
#     --docker-username=<GITHUB_USER> \
#     --docker-password=<GITHUB_TOKEN> \
#     -n greenhouse
#
# After all required HelmReleases are Ready, copy the OCM TLS secret and proceed
# to the main deploy: kubectl apply -f deploy/instance.yaml
apiVersion: kro.run/v1alpha1
kind: GreenhouseBootstrap
metadata:
  name: greenhouse-bootstrap
  namespace: greenhouse
spec:
  rbscRegistry: "ghcr.io/sofiyadesaisap/greenhouse-rbsc"
  registrySecretName: "greenhouse-ocm-registry-creds"
  certManagerVersion: "1.20.1"
  prometheusCrdsVersion: "14.0.0"
  ocmControllerVersion: "0.33.0"
  kroVersion: "0.9.4"
  fluxVersion: "2.5.1"

  # Master switch — false suspends ALL prerequisite components regardless of per-component flags.
  installPrerequisites: true

  # Per-component flags — false suspends that component's OCIRepository + HelmRelease.
  # Use when the component is already installed and managed outside this bootstrap.
  installCertManager:    true
  installOcmController:  true
  installPrometheusCrds: true

  # Flux and kro are typically pre-installed manually (they must exist before this RGD
  # is processed). Set true only if they are NOT already present — see bootstrapping
  # constraint in bootstrap-rgd.yaml header.
  enableKro:  false
  enableFlux: false
