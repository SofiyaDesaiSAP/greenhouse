# DEPRECATED — superseded by the ComponentVersion resource in ocm/deploy/kro-rgd.yaml.
# The kro RGD now manages ComponentVersion directly, so applying this file separately
# would create a duplicate CR and conflict with kro-owned state.
# Retained for reference only; do NOT include in kustomization.yaml.
#
# OCM ComponentVersion — previously applied via kustomize (deploy/kustomization.yaml).
# Watches the RBSC registry for the greenhouse product component and resolves
# the semver constraint to the latest matching version.
apiVersion: delivery.ocm.software/v1alpha1
kind: ComponentVersion
metadata:
  name: greenhouse
  namespace: greenhouse
spec:
  interval: 10m
  component: github.com/cloudoperators/greenhouse
  version:
    semver: ">=0.18.0"
  repository:
    url: ghcr.io/sofiyadesaisap/greenhouse-rbsc
    secretRef:
      name: greenhouse-ocm-registry-creds
