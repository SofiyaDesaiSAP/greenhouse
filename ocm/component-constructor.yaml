# yaml-language-server: $schema=https://ocm.software/latest/schemas/bindings/go/constructor/schema-2020-12.json
#
# OCM Component Descriptor for Greenhouse
#
# Variables (set via env or make):
#   GREENHOUSE_VERSION        - greenhouse app version, e.g. 0.16.1
#   GREENHOUSE_IMAGE_REF      - full image ref, e.g. ghcr.io/cloudoperators/greenhouse:v0.16.1
#   CERT_MANAGER_VERSION      - e.g. 1.16.1  (no v-prefix; OCM adds v where required)
#   FLUX_VERSION              - e.g. 2.15.0
#   KRO_VERSION               - e.g. 0.9.4
#   OCM_CONTROLLER_VERSION    - e.g. 0.33.0  (no v-prefix; OCM adds v where required)
#
# Workflow:
#   make dep-update  # helm dependency update for greenhouse chart (file:// subcharts only)
#   make build       # ocm add componentversions → greenhouse-bundle.ctf
#                    # OCM fetches all prereq charts directly from their registries
#   make push        # ocm transfer ctf → OCM_REGISTRY
#
# Prerequisites bundled as componentReferences:
#   cert-manager, flux, kro, ocm-controller
#
# Core components (single image ghcr.io/cloudoperators/greenhouse):
#   controller-manager, idproxy, cors-proxy, authz
#
# NOTE: OCM label names must be valid Kubernetes label keys (prefix/name, max 1 slash)
# because the OCM controller maps them directly to Kubernetes labels on ComponentDescriptor CRDs.

components:

  # -------------------------------------------------------------------------
  # Prerequisite: cert-manager
  # OCM fetches directly from https://charts.jetstack.io — no helm pull needed.
  # jetstack chart versions use v-prefix (v1.16.1), hence "v${CERT_MANAGER_VERSION}".
  # -------------------------------------------------------------------------
  - name: github.com/cloudoperators/greenhouse/prerequisites/cert-manager
    version: ${CERT_MANAGER_VERSION}
    provider:
      name: cloudoperators
    labels:
      - name: cloudoperators.github.com/role
        value: prerequisite
    resources:
      - name: cert-manager-chart
        type: helmChart
        version: ${CERT_MANAGER_VERSION}
        input:
          type: helm
          path: cert-manager
          helmRepository: https://charts.jetstack.io
          version: v${CERT_MANAGER_VERSION}

  # -------------------------------------------------------------------------
  # Prerequisite: flux2 (greenhouse-customized kustomization)
  # Bundles config/samples/flux/ from this repo — the kustomization overlay that:
  #   - patches NetworkPolicy to allow greenhouse namespace access to flux artifacts
  #     (no extra RBAC needed for greenhouse controller)
  #   - enables ExternalArtifact feature gate on kustomize-controller
  #   - removes unused image-automation-controller + image-reflector-controller
  # The flux version pinned in the kustomization (v2.9.5) is intentional — update
  # config/samples/flux/kustomization.yaml to change it.
  # -------------------------------------------------------------------------
  - name: github.com/cloudoperators/greenhouse/prerequisites/flux
    version: ${FLUX_VERSION}
    provider:
      name: cloudoperators
    labels:
      - name: cloudoperators.github.com/role
        value: prerequisite
    resources:
      - name: flux-kustomization
        type: blob
        version: ${FLUX_VERSION}
        input:
          type: dir
          path: ../config/samples/flux
          compress: true

  # -------------------------------------------------------------------------
  # Prerequisite: kro (Kubernetes Resource Orchestrator)
  # OCM fetches directly from OCI registry — no helm pull needed.
  # -------------------------------------------------------------------------
  - name: github.com/cloudoperators/greenhouse/prerequisites/kro
    version: ${KRO_VERSION}
    provider:
      name: cloudoperators
    labels:
      - name: cloudoperators.github.com/role
        value: prerequisite
    resources:
      - name: kro-chart
        type: helmChart
        version: ${KRO_VERSION}
        input:
          type: helm
          path: kro
          helmRepository: oci://registry.k8s.io/kro/charts
          version: ${KRO_VERSION}

  # -------------------------------------------------------------------------
  # Prerequisite: ocm-controller
  # OCM fetches directly from ghcr.io OCI — no helm pull needed.
  # OCI tag uses v-prefix (v0.33.0), hence "v${OCM_CONTROLLER_VERSION}".
  # -------------------------------------------------------------------------
  - name: github.com/cloudoperators/greenhouse/prerequisites/ocm-controller
    version: ${OCM_CONTROLLER_VERSION}
    provider:
      name: cloudoperators
    labels:
      - name: cloudoperators.github.com/role
        value: prerequisite
    resources:
      - name: ocm-controller-chart
        type: helmChart
        version: ${OCM_CONTROLLER_VERSION}
        input:
          type: helm
          path: ocm-controller
          helmRepository: oci://ghcr.io/open-component-model/helm
          version: v${OCM_CONTROLLER_VERSION}

  # -------------------------------------------------------------------------
  # Greenhouse core (chart + image)
  # OCM packages the chart directory directly — no helm package needed.
  # Prerequisite: run `make dep-update` once if ../charts/greenhouse/charts/ is empty
  # (needed to resolve the file:// subchart dependencies idproxy, cors-proxy, etc.)
  # GREENHOUSE_VERSION is used for both the component version and the chart version hint.
  # GREENHOUSE_IMAGE_REF is the full OCI image reference
  # -------------------------------------------------------------------------
  - name: github.com/cloudoperators/greenhouse/core
    version: ${GREENHOUSE_VERSION}
    provider:
      name: cloudoperators
    labels:
      - name: cloudoperators.github.com/role
        value: core
    resources:

      # Greenhouse umbrella chart (bundles manager, idproxy, cors-proxy, authz, dashboard subcharts)
      # OCM packages ../charts/greenhouse/ directory as an OCI artifact set.
      - name: greenhouse-chart
        type: helmChart
        version: ${GREENHOUSE_VERSION}
        input:
          type: helm
          path: ../charts/greenhouse
          version: ${GREENHOUSE_VERSION}

      # Single image used by controller-manager, idproxy, cors-proxy, and authz subcharts
      # Pass GREENHOUSE_IMAGE_REF=ghcr.io/cloudoperators/greenhouse:v0.16.1
      - name: greenhouse-image
        type: ociImage
        version: ${GREENHOUSE_VERSION}
        access:
          type: OCIImage/v1
          imageReference: ${GREENHOUSE_IMAGE_REF}

      # kro-rgd: plain YAML manifest containing the kro ResourceGraphDefinition.
      # Applied directly to the cluster by the OCM Deployer (no Helm chart needed).
      - name: kro-rgd
        type: blob
        version: ${GREENHOUSE_VERSION}
        input:
          type: file
          path: deploy/kro-rgd.yaml
          mediaType: application/yaml
          compress: false

  # -------------------------------------------------------------------------
  # Top-level product component — references core + all prerequisites
  # -------------------------------------------------------------------------
  - name: github.com/cloudoperators/greenhouse
    version: ${GREENHOUSE_VERSION}
    provider:
      name: cloudoperators
    componentReferences:
      - name: core
        componentName: github.com/cloudoperators/greenhouse/core
        version: ${GREENHOUSE_VERSION}
      - name: cert-manager
        componentName: github.com/cloudoperators/greenhouse/prerequisites/cert-manager
        version: ${CERT_MANAGER_VERSION}
      - name: flux
        componentName: github.com/cloudoperators/greenhouse/prerequisites/flux
        version: ${FLUX_VERSION}
      - name: kro
        componentName: github.com/cloudoperators/greenhouse/prerequisites/kro
        version: ${KRO_VERSION}
      - name: ocm-controller
        componentName: github.com/cloudoperators/greenhouse/prerequisites/ocm-controller
        version: ${OCM_CONTROLLER_VERSION}
